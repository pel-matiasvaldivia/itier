# iTier — Fase 1 y 2 en el VPS propio. El stack se sirve detrás de un proxy que
# termina TLS: Cloudflare Tunnel en ESTE host (recomendado), o NPM en otro VPS.
#
# Núcleo ITSM (GLPI) + eventos/métricas (Zabbix). GLPI requiere MySQL/MariaDB
# (NO soporta Postgres), así que corre sobre su propia MariaDB; Zabbix sobre
# Postgres. Dos motores, cada uno con lo suyo.
#
# Topología: los frontends PUBLICAN su puerto en el host y el proxy los alcanza
# por `WEB_BIND:puerto`:
#   - GLPI        → ${GLPI_HTTP_PORT:-8884}/tcp
#   - Zabbix web  → ${ZBX_WEB_PORT:-8885}/tcp
#   - Consola     → ${CONSOLE_PORT:-8083}/tcp  (plano de control; opera GLPI+Zabbix)
# Con Cloudflare Tunnel en este host: WEB_BIND=127.0.0.1 (solo loopback, nada
# expuesto) y el ingress apunta a http://localhost:<puerto>. Con NPM en otra VPS:
# WEB_BIND=IP-LAN y firewall al VPS de NPM. El 10051/tcp (servidor Zabbix) es
# aparte y TCP crudo: NO pasa por el túnel HTTP de Cloudflare — los zabbix-proxy
# de los clientes lo alcanzan directo (IP/VPN). La base de datos NO publica puertos.
#
# Requisitos previos:
#   - Copiar .env.example a .env y completar contraseñas, WEB_BIND y puertos.
#
# ⚠ VERIFICAR antes de producción: los nombres de variables del contenedor de
#   GLPI 11 (imagen oficial reciente) pueden diferir; ver comentarios en el
#   servicio `glpi` y deploy/vps/README.md.

name: itier-vps

x-comun: &comun
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  # ── Base de datos de Zabbix (PostgreSQL) ──────────────────────────────────
  db:
    <<: *comun
    image: postgres:16-alpine
    environment:
      # Superusuario de Postgres (lo usa el init de Zabbix). GLPI NO usa Postgres
      # (requiere MySQL/MariaDB): tiene su propio contenedor `mariadb`.
      POSTGRES_DB: ${POSTGRES_DB:-glpi}
      POSTGRES_USER: ${POSTGRES_USER:-glpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      # La usa el script de init para crear el rol/base de Zabbix.
      ZABBIX_DB_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ZABBIX_DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Los .sh de este directorio corren SOLO en la primera inicialización
      # (data dir vacío). Crea el rol y la base de Zabbix junto a los de GLPI.
      - ./init:/docker-entrypoint-initdb.d:ro
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glpi} -d ${POSTGRES_DB:-glpi}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Base de datos de GLPI (MariaDB) ───────────────────────────────────────
  # GLPI 11 NO soporta PostgreSQL: requiere MySQL 8.0+ / MariaDB 10.6+
  # (https://glpi-install.readthedocs.io/en/latest/prerequisites.html). Por eso
  # tiene su propia base, separada del Postgres de Zabbix. El contenedor crea la
  # base y el usuario de GLPI en el primer arranque.
  mariadb:
    <<: *comun
    image: ${GLPI_DB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_DATABASE: ${GLPI_DB_NAME:-glpi}
      MARIADB_USER: ${GLPI_DB_USER:-glpi}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:?falta GLPI_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?falta GLPI_DB_ROOT_PASSWORD}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - glpi_db:/var/lib/mysql
    networks: [interna]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Arreglo de permisos de los volúmenes de GLPI ──────────────────────────
  # GLPI corre como usuario no-root; los volúmenes glpi_files/glpi_config nacen
  # propiedad de root, así que GLPI no puede crear `_cache` y falla. Este init
  # corre ANTES que glpi, como root y con la MISMA imagen de GLPI: lee el dueño
  # real de /var/glpi (el que la imagen le da a su usuario web) y se lo aplica a
  # los volúmenes. Es agnóstico del uid, idempotente y sale al terminar.
  glpi-init:
    image: ${GLPI_IMAGE:-glpi/glpi:11.0}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        ref=$$(stat -c '%u:%g' /var/glpi);
        [ "$$ref" = "0:0" ] && ref=33:33;
        echo "iTier: aplicando dueño $$ref a los volúmenes de GLPI";
        chown -R "$$ref" /vol/files /vol/config
    volumes:
      - glpi_files:/vol/files
      - glpi_config:/vol/config
    networks: [interna]
    restart: "no"

  # ── Núcleo ITSM: GLPI ─────────────────────────────────────────────────────
  glpi:
    <<: *comun
    # GLPI 11 salió en 2025-10; la imagen y sus variables son nuevas. Se
    # parametriza para poder fijar un digest/tag verificado sin editar el YAML.
    image: ${GLPI_IMAGE:-glpi/glpi:11.0}
    depends_on:
      mariadb: { condition: service_healthy }
      glpi-init: { condition: service_completed_successfully }
    environment:
      # Imagen oficial glpi/glpi: con estas 5 variables presentes, hace la
      # auto-instalación en el primer arranque. GLPI usa MySQL/MariaDB (no
      # Postgres); el puerto MySQL por defecto es 3306.
      GLPI_DB_HOST: mariadb
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpi}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpi}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?falta GLPI_DB_PASSWORD}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - glpi_files:/var/glpi/files
      - glpi_config:/var/glpi/config
    networks: [interna, publica]
    ports:
      # Publicado para que NPM (en otro VPS de la LAN) lo alcance. Atalo a la IP
      # de la LAN con WEB_BIND. El contenedor sirve en 80 (ajustá si tu imagen
      # usa otro puerto). En NPM: Proxy Host → http://<IP-LAN>:${GLPI_HTTP_PORT:-8884}
      - "${WEB_BIND:-0.0.0.0}:${GLPI_HTTP_PORT:-8884}:80"

  # ── Eventos y métricas: servidor Zabbix ───────────────────────────────────
  zabbix-server:
    <<: *comun
    image: zabbix/zabbix-server-pgsql:${ZABBIX_VERSION:-alpine-7.0-latest}
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_SERVER_HOST: db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ZABBIX_DB_PASSWORD}
      ZBX_TIMEOUT: "10"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      # Los zabbix-proxy de los clientes se conectan aquí de forma saliente por
      # internet — por eso este bind es PÚBLICO (distinto del de la web, que va a
      # la LAN). Restringí el origen en el firewall a las IP de tus clientes y
      # usá PSK/TLS. Ver deploy/vps/README.md.
      - "${ZBX_SERVER_BIND:-0.0.0.0}:10051:10051"
    networks: [interna]

  # ── Eventos y métricas: frontend web de Zabbix ────────────────────────────
  zabbix-web:
    <<: *comun
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_VERSION:-alpine-7.0-latest}
    depends_on:
      db: { condition: service_healthy }
      zabbix-server: { condition: service_started }
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      DB_SERVER_HOST: db
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?falta ZABBIX_DB_PASSWORD}
      PHP_TZ: ${TZ:-America/Argentina/Buenos_Aires}
    networks: [interna, publica]
    ports:
      # El contenedor de la web de Zabbix sirve en 8080. En NPM:
      # Proxy Host → http://<IP-LAN>:${ZBX_WEB_PORT:-8885}
      - "${WEB_BIND:-0.0.0.0}:${ZBX_WEB_PORT:-8885}:8080"

  # ── Consola de operación: el plano de control (ADR-0008) ──────────────────
  # Web única que opera GLPI y Zabbix POR LA RED INTERNA (por nombre de servicio:
  # http://glpi y http://zabbix-web:8080), sin salir al host ni exponer sus APIs.
  # Publica su propio puerto en `publica` para que NPM (en el otro VPS) la alcance.
  # Los tokens de API se generan DENTRO de GLPI/Zabbix: ver deploy/vps/README.md.
  consola:
    <<: *comun
    build: ../../consola
    image: ${CONSOLE_IMAGE:-itier-console:local}
    depends_on:
      glpi: { condition: service_started }
      zabbix-web: { condition: service_started }
    environment:
      # Clave de sesión (obligatoria): openssl rand -hex 32
      ITIER_CONSOLE_SECRET: ${ITIER_CONSOLE_SECRET:?falta ITIER_CONSOLE_SECRET}
      # Admin inicial (se crea solo en el primer arranque; cambia clave + enrola 2FA).
      ITIER_CONSOLE_ADMIN_USER: ${ITIER_CONSOLE_ADMIN_USER:-admin}
      ITIER_CONSOLE_ADMIN_PASSWORD: ${ITIER_CONSOLE_ADMIN_PASSWORD:?falta ITIER_CONSOLE_ADMIN_PASSWORD}
      ITIER_CONSOLE_DB: /data/consola.sqlite3
      ITIER_CONSOLE_PORT: "8080"
      # GLPI por la red interna (API REST en /apirest.php). Tokens: ver README.
      ITIER_GLPI_URL: ${ITIER_GLPI_URL:-http://glpi}
      ITIER_GLPI_APP_TOKEN: ${ITIER_GLPI_APP_TOKEN:-}
      ITIER_GLPI_USER_TOKEN: ${ITIER_GLPI_USER_TOKEN:-}
      # URL PÚBLICA de GLPI (por NPM) para el bundle de enrolamiento del cliente.
      ITIER_PUBLIC_GLPI_URL: ${ITIER_PUBLIC_GLPI_URL:-}
      # Zabbix por la red interna (la web sirve en 8080).
      ITIER_ZBX_URL: ${ITIER_ZBX_URL:-http://zabbix-web:8080}
      ITIER_ZBX_TOKEN: ${ITIER_ZBX_TOKEN:-}
      ITIER_ZBX_USER: ${ITIER_ZBX_USER:-}
      ITIER_ZBX_PASSWORD: ${ITIER_ZBX_PASSWORD:-}
      # Dirección pública del server Zabbix (host o host:puerto) que marcan los
      # zabbix-proxy de los clientes. Va en el bundle de enrolamiento.
      ITIER_ZBX_SERVER_HOST: ${ITIER_ZBX_SERVER_HOST:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - consola_data:/data
    networks: [interna, publica]
    ports:
      # NPM (otro VPS) → Proxy Host http://<IP-LAN>:${CONSOLE_PORT:-8083}
      - "${WEB_BIND:-0.0.0.0}:${CONSOLE_PORT:-8083}:8080"
    # Endurecimiento extra: FS de solo lectura + tmpfs (el estado va al volumen).
    read_only: true
    tmpfs: [/tmp]

networks:
  # Red de los frontends: puente normal con salida a internet. Sobre ella viven
  # los puertos publicados que NPM alcanza desde el otro VPS.
  publica:
    driver: bridge
  # Red interna del stack: la base de datos nunca sale a internet ni se publica.
  interna:
    driver: bridge
    internal: true

volumes:
  db_data:
  glpi_db:
  glpi_files:
  glpi_config:
  consola_data:
