# Ejemplo de ingress de Cloudflare Tunnel para iTier (cloudflared en ESTE VPS).
#
# Dos formas de configurar el túnel; usá la que corresponda a cómo lo creaste:
#
# A) Túnel ADMINISTRADO REMOTAMENTE (lo corrés con token: `cloudflared tunnel
#    run --token ...`, típico si lo creaste desde el panel). El ingress NO se
#    toma de este archivo: cargá estas mismas reglas en el panel, en
#    Zero Trust → Networks → Tunnels → (tu túnel) → Public Hostnames.
#    Por cada hostname, "Service" = la URL http://localhost:<puerto> de abajo.
#
# B) Túnel ADMINISTRADO LOCALMENTE (config.yml). Copiá este archivo a
#    /etc/cloudflared/config.yml, ajustá tunnel/credentials, y creá los DNS:
#      cloudflared tunnel route dns <tunel> itier.pymesenlinea.com.ar
#      cloudflared tunnel route dns <tunel> panel.itier.pymesenlinea.com.ar
#      cloudflared tunnel route dns <tunel> itsm.itier.pymesenlinea.com.ar
#      cloudflared tunnel route dns <tunel> zabbix.itier.pymesenlinea.com.ar
#
# Requisito: en deploy/vps/.env → WEB_BIND=127.0.0.1 (y la landing con
# LANDING_BIND=127.0.0.1), para que los servicios escuchen solo en loopback y
# únicamente el túnel los alcance.

tunnel: NOMBRE-O-UUID-DE-TU-TUNEL
credentials-file: /etc/cloudflared/NOMBRE-O-UUID.json

ingress:
  # Landing pública (corre en landing/docker-compose.yml, puerto 8082)
  - hostname: itier.pymesenlinea.com.ar
    service: http://localhost:8082

  # Consola / dashboard (plano de control)
  - hostname: panel.itier.pymesenlinea.com.ar
    service: http://localhost:8083

  # GLPI — lo necesitan los clientes (inventario glpi-agent + API del agente).
  # Debe ser público; por eso tiene su propio hostname.
  - hostname: itsm.itier.pymesenlinea.com.ar
    service: http://localhost:8884

  # Zabbix web — OPCIONAL (la consola ya opera Zabbix). Quitalo si no querés
  # exponer el dashboard nativo.
  - hostname: zabbix.itier.pymesenlinea.com.ar
    service: http://localhost:8885

  # Regla final obligatoria: todo lo demás, 404.
  - service: http_status:404

# ⚠ El servidor Zabbix (10051/tcp) NO va acá: es TCP crudo y el túnel HTTP de
#   Cloudflare no lo transporta. Los zabbix-proxy de los clientes deben alcanzar
#   ese puerto por una vía directa (IP pública del VPS con firewall acotado, o
#   una VPN). Es el valor de ITIER_ZBX_SERVER_HOST en el bundle de enrolamiento.
