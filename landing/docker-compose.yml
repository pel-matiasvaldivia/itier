# Landing de iTier — sitio estático detrás de un proxy que termina TLS.
#
# Sirve index.html y manual.html con un nginx mínimo. PUBLICA su puerto en el
# host y el proxy lo alcanza por LANDING_BIND:puerto.
#
# Recomendado — Cloudflare Tunnel en ESTE host: LANDING_BIND=127.0.0.1 (solo
# loopback) y en el ingress:
#   itier.pymesenlinea.com.ar → http://localhost:${LANDING_PORT:-8082}
# (ver deploy/vps/README.md → "Detrás de Cloudflare Tunnel").
#
# Alternativa — NPM en otro VPS: LANDING_BIND=IP-LAN y Proxy Host
#   itier.pymesenlinea.com.ar → http://<IP-LAN-de-este-host>:${LANDING_PORT:-8082}
# limitando el firewall a la IP del VPS de NPM.

name: itier-landing

services:
  landing:
    image: nginx:alpine
    container_name: itier-landing
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manual.html:/usr/share/nginx/html/manual.html:ro
    ports:
      - "${LANDING_BIND:-0.0.0.0}:${LANDING_PORT:-8082}:80"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
