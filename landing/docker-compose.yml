# Landing de iTier — sitio estático, con NPM en otro VPS de la misma LAN.
#
# Sirve index.html y manual.html con un nginx mínimo. Como NPM corre en otro VPS
# y no comparte la red de Docker, la landing PUBLICA su puerto en el host y NPM
# lo alcanza por IP-LAN:puerto.
#
# En NPM (en el otro VPS): Proxy Host
#   itier.pymesenlinea.com.ar → http://<IP-LAN-de-este-host>:${LANDING_PORT:-8082}
#   (pedí el certificado Let's Encrypt desde la misma pantalla).
#
# Atá LANDING_BIND a la IP de la LAN y limitá el firewall a la IP del VPS de NPM.

name: itier-landing

services:
  landing:
    image: nginx:alpine
    container_name: itier-landing
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manual.html:/usr/share/nginx/html/manual.html:ro
    ports:
      - "${LANDING_BIND:-0.0.0.0}:${LANDING_PORT:-8082}:80"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
