name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Paquete del agente: compila y corre la parte determinista de la demo ──
  edge-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar el paquete (editable, para que la demo halle las policies)
        run: pip install -e ./reference/edge-agent

      - name: Compilar todo el paquete (chequeo de sintaxis)
        run: python -m compileall -q reference/edge-agent/itier_agent

      - name: Demo sin clave (motor de políticas + auditoría + bucle de eventos)
        # Sin ANTHROPIC_API_KEY la demo corre solo la parte determinista y
        # omite el bucle del LLM; sirve como smoke test en CI.
        run: python -m itier_agent.demo

      - name: Tests de Fase 3 (motor de políticas + bucle de eventos, offline)
        # Aserciones sobre el motor de políticas (niveles L0–L4, techos, CIs
        # intocables) y el runner (dedup, tormenta, triage, despacho). Sin LLM.
        run: python reference/edge-agent/tests/test_fase3.py

      - name: Test del cliente de Zabbix (camino real, HTTP simulado)
        # problem.get + event.get (Bearer, filtro por grupo) y el mapeo a Evento,
        # con httpx.MockTransport. No requiere un Zabbix real.
        run: python reference/edge-agent/tests/test_zabbix.py

  # ── Consola (plano de control): compila y corre el smoke test en modo demo ─
  consola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar el paquete de la consola
        run: pip install -e ./consola

      - name: Compilar todo el paquete (chequeo de sintaxis)
        run: python -m compileall -q consola/itier_console

      - name: Smoke test funcional en modo demo
        # Recorre login+2FA (TOTP real), alta de cliente, agentes, tickets y la
        # cadena de auditoría, más pruebas negativas. Sin GLPI/Zabbix reales.
        run: python consola/tests/smoke_demo.py

      - name: Test de adaptadores (camino real, HTTP simulado)
        # Verifica la construcción de requests y el parseo contra GLPI/Zabbix
        # falsos (httpx.MockTransport): headers, envoltura JSON-RPC, PSK, etc.
        run: python consola/tests/test_adapters.py

  # ── Manifiestos de despliegue: valida que los compose interpolen y parseen ─
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar compose del VPS
        run: |
          cd deploy/vps
          cp .env.example .env
          docker compose config >/dev/null
          echo "deploy/vps OK"

      - name: Validar compose del cliente
        run: |
          cd deploy/cliente
          cp .env.example .env
          docker compose config >/dev/null
          echo "deploy/cliente OK"

      - name: Validar compose de la consola
        run: |
          cd consola
          cp .env.example .env
          # ITIER_CONSOLE_SECRET vacío en el ejemplo; para `config` no importa.
          docker compose config >/dev/null
          echo "consola OK"
