name: build-console

# Construye y publica la imagen de la consola (plano de control) a GHCR, para
# que el VPS solo haga `pull` y NO compile nada. Solo amd64: la consola corre en
# el VPS (x86), no en las sondas arm. En pull requests solo construye, no publica.

on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*.*.*']
    paths:
      - 'consola/**'
      - '.github/workflows/build-console.yml'
  pull_request:
    paths:
      - 'consola/**'
      - '.github/workflows/build-console.yml'
  workflow_dispatch:

concurrency:
  group: build-console-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/itier-console

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # Login solo cuando vamos a publicar (no en pull requests).
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir (y publicar si no es PR)
        uses: docker/build-push-action@v6
        with:
          context: consola
          file: consola/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
