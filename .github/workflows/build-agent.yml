name: build-agent

# Construye y publica la imagen del agente de borde a GHCR, multi-arch
# (amd64 + arm64): amd64 para el mini-PC del appliance, arm64 para la sonda
# Raspberry Pi 5 (ADR-0007). En pull requests solo construye, no publica.

on:
  push:
    branches: ['main', 'master', 'claude/**']
    tags: ['v*.*.*']
    paths:
      - 'reference/edge-agent/**'
      - '.github/workflows/build-agent.yml'
  pull_request:
    paths:
      - 'reference/edge-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

concurrency:
  group: build-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/itier-agent

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (emulación para arm64)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # Login solo cuando vamos a publicar (no en pull requests).
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir (y publicar si no es PR)
        uses: docker/build-push-action@v6
        with:
          context: reference/edge-agent
          file: reference/edge-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
