{% extends "base.html" %}
{% block titulo %}Cambiar contraseña · Consola de iTier{% endblock %}
{% block contenido %}
  <div class="page-head"><h1>Cambiar contraseña</h1></div>
  <div class="card narrow">
    <form method="post" action="/cambiar-clave" class="form">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Contraseña actual <span class="muted small">(dejá en blanco si es tu primer ingreso)</span>
        <input type="password" name="actual" autocomplete="current-password">
      </label>
      <label>Nueva contraseña <span class="muted small">(mínimo 10 caracteres)</span>
        <input type="password" name="nueva" autocomplete="new-password" required>
      </label>
      <label>Repetir nueva contraseña
        <input type="password" name="repetir" autocomplete="new-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Guardar</button>
    </form>
  </div>
{% endblock %}
