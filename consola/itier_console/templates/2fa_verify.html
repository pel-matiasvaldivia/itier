{% extends "base.html" %}
{% block titulo %}Código 2FA · Consola de iTier{% endblock %}
{% block auth %}
  <h1>Segundo factor</h1>
  <p class="muted">Ingresá el código de 6 dígitos de tu app de autenticación{% if pending_user %} para <strong>{{ pending_user }}</strong>{% endif %}.</p>
  <form method="post" action="/login/2fa" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Código
      <input type="text" name="code" inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code" autofocus required>
    </label>
    <button class="btn btn-primary" type="submit">Verificar</button>
  </form>
  <p class="authalt"><a href="/login">Volver</a></p>
{% endblock %}
